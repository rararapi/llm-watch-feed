<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site_tagline }}{% endblock %}">
  <link rel="stylesheet" href="{{ asset('css/styles.css') }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site_name }} - All" href="{{ feeds_base_url }}/feeds/all.xml">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ page_url('index.html') }}">
        <span class="brand__mark" aria-hidden="true">◈</span>
        <span class="brand__text">
          <span class="brand__name">{{ site_name }}</span>
          <span class="brand__tagline">{{ site_tagline }}</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="主要リンク">
        <a href="{{ page_url('index.html') }}">ニュース</a>
        <a href="{{ page_url('subscribe.html') }}">RSS購読</a>
        <a class="site-nav__rss" href="{{ feeds_base_url }}/feeds/all.xml" title="RSS: All">RSS</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="site-footer__links">
        <a href="{{ page_url('index.html') }}">ニュース</a>
        <a href="{{ page_url('subscribe.html') }}">RSS購読 / Teams連携</a>
        <a href="{{ feeds_base_url }}/feeds/all.xml">RSSフィード</a>
      </p>
      <p class="site-footer__note">{{ site_name }} — AIニュースを自動収集・要約して配信しています。</p>
      <p class="site-footer__note">当サイトには広告・アフィリエイトリンクが含まれます。</p>
    </div>
  </footer>

  <script src="{{ asset('js/app.js') }}" defer></script>
</body>
</html>
