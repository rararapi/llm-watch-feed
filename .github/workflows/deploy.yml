name: Deploy on merge to main

# main へのマージ（= push）で自動デプロイする。
#   - docs/ など画面の変更 → Firebase Hosting へデプロイ
#   - scripts/ や Dockerfile の変更 → Cloud Run Job のイメージを再ビルド＆ジョブ更新
# 変更箇所に応じて必要なジョブだけが走る（paths-filter）。
# 毎日のニュース更新は Cloud Scheduler が回すのでここでは扱わない。
#
# 認証は Workload Identity Federation（鍵レス）。事前準備は DEPLOY.md「CI 自動デプロイ」を参照。
# 必要な GitHub Secrets:
#   GCP_WIF_PROVIDER  例: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
#   GCP_DEPLOY_SA     例: gha-deployer@ai-watch-feed.iam.gserviceaccount.com

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # WIF でトークンを取得するために必須

env:
  PROJECT_ID: ai-watch-feed
  REGION: asia-northeast1
  AR_REPO: llm-watch
  JOB: llm-watch-collector

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      job: ${{ steps.filter.outputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - 'docs/**'
              - 'firebase.json'
              - '.firebaserc'
            job:
              - 'scripts/**'
              - 'Dockerfile'
              - '.dockerignore'    # ビルドコンテキストに影響するため再ビルド対象
              - '.gcloudignore'    # gcloud builds submit のアップロード対象を決める
              - 'requirements*.txt'
              - 'templates/**'     # generate_pages.py のテンプレ（イメージに COPY）
              - 'assets/**'        # サイト静的物（イメージに COPY）
              - 'docs/**'   # docs/ はイメージにも COPY されるためジョブも再ビルド対象

  deploy-site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        # auth ステップが GOOGLE_APPLICATION_CREDENTIALS を export 済み。firebase CLI はそれを使う。
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --non-interactive --project "$PROJECT_ID"

  deploy-job:
    needs: changes
    if: needs.changes.outputs.job == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image, then update Cloud Run Job
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/collector:${GITHUB_SHA}"
          gcloud builds submit --tag "$IMAGE" --project "$PROJECT_ID"
          gcloud run jobs update "$JOB" \
            --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID"
