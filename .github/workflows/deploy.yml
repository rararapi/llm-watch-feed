name: Deploy on merge to main

# On pushes to main, rebuild the Cloud Run Job image and run the job.
# The job generates pages and deploys them to Firebase Hosting.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ai-watch-feed
  REGION: asia-northeast1
  AR_REPO: llm-watch
  JOB: llm-watch-collector

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      job: ${{ steps.filter.outputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            job:
              - 'scripts/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.gcloudignore'
              - '.github/workflows/deploy.yml'
              - 'requirements*.txt'
              - 'templates/**'
              - 'assets/**'
              - 'docs/**'

  deploy-job:
    needs: changes
    if: needs.changes.outputs.job == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image, update Cloud Run Job, and run deployment
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/collector:${GITHUB_SHA}"
          gcloud builds submit --tag "$IMAGE" --project "$PROJECT_ID"
          gcloud run jobs update "$JOB" \
            --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID"
          gcloud run jobs execute "$JOB" \
            --region "$REGION" --project "$PROJECT_ID" --wait
