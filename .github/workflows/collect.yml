name: Collect LLM Model Feed

on:
  schedule:
    # Tue and Fri at 09:00 JST (UTC 00:00)
    - cron: "0 0 * * 2,5"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect LLM model articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: python scripts/collect.py

      - name: Generate RSS feeds
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/generate_feeds.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/models.json docs/feeds/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update LLM model feed $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
